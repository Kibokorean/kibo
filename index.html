on:relative;display:flex;flex-direction:column;padding:21px;border:1px solid #333952;border-radius:20px;background:#121522;box-shadow:7px 8px 0 rgba(255,255,255,.035)}.test-card:before{content:'';position:absolute;top:0;left:18px;width:72px;height:3px;background:var(--accent)}.card-number{color:var(--accent);font-size:34px;font-weight:900;line-height:1}.card-type{margin-top:3px;color:#8e96aa;font-size:10px;letter-spacing:1.5px}.test-card h2{margin:26px 0 5px;color:#fff;font-size:21px}.test-card p{margin:0;color:#c4cada;font-size:14px}.test-card button{margin-top:auto;padding:10px 0 0;text-align:right;color:var(--accent);background:transparent;border:0;border-radius:0;font-size:13px}.home #home{display:block}.home header,.home main{display:none}#app>header{display:none}main,iframe{height:100vh}@media(max-width:600px){#home{padding:24px 16px 45px}.home-title{font-size:28px}}</style></head><body>

<script>const sources={"읽기 1–2":"test-01.html","읽기 3–4":"test-02.html","읽기 5":"test-03.html","읽기 6":"test-04.html","읽기 7":"test-05.html","읽기 8":"test-06.html","읽기 9":"test-07.html","읽기 10":"test-08.html","읽기 11–12":"test-09.html","읽기 13–15":"test-10.html","읽기 16–18":"test-11.html","읽기 19–20":"test-12.html","읽기 21–22":"test-13.html","읽기 23–24":"test-14.html","읽기 25–27":"test-15.html","읽기 28–31":"test-16.html"},login=document.getElementById('login'),app=document.getElementById('app'),frame=document.getElementById('lessonFrame'),buttons=[...document.querySelectorAll('[data-lesson]')];let currentUrl='';async function openLesson(label){
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.lesson===label));
  try{
    const response=await fetch(sources[label],{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const html=await response.text();
    frame.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  }catch(error){ console.error(error); frame.src=sources[label]; }
}
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('password').value!=='kibo'){document.getElementById('error').textContent='Kirish kodi noto‘g‘ri.';return}login.style.display='none';app.style.display='grid';openLesson(buttons[0].dataset.lesson)});buttons.forEach(b=>b.addEventListener('click',()=>openLesson(b.dataset.lesson)))</script><script>const showHome=()=>{app.classList.add('home');frame.src='about:blank'};document.querySelectorAll('[data-open]').forEach(card=>card.addEventListener('click',()=>{openLesson(card.dataset.open);app.classList.remove('home')}));buttons.forEach(button=>button.addEventListener('click',()=>app.classList.remove('home')));document.getElementById('homeBtn').addEventListener('click',showHome);document.getElementById('loginForm').addEventListener('submit',()=>setTimeout(showHome,0));window.addEventListener('message',event=>{if(event.data&&event.data.type==='kibo-home')showHome()});</script></body></html>
